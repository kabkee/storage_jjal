# 짤 복사 도우미(Windows) 설치 프로그램 빌드 → GitHub 릴리스에 JjalCopySetup.exe 첨부
# 태그 jjalcopy-vX.Y.Z 를 올리면(또는 gh release create 로 태그 생성) 실행된다.
# workflow_dispatch 는 기본 브랜치(main)에 이 파일이 있어야 동작한다 — 작업 브랜치는 jjal_kabkee 라 태그로 돌린다.
name: jjalcopy-release

on:
  push:
    tags: ['jjalcopy-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: helper/windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 앱 빌드 (.NET Framework 4.8)
        run: |
          dotnet build -c Release -o dist/build -nologo
          Copy-Item dist/build/JjalCopy.exe dist/JjalCopy.exe

      - name: 설치 프로그램 빌드 (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc installer/JjalCopy.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 실패 $LASTEXITCODE" }
          Get-Item dist/JjalCopySetup.exe | Format-List Name, Length
          (Get-FileHash dist/JjalCopySetup.exe -Algorithm SHA256).Hash.ToLower() | Out-File dist/JjalCopySetup.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: JjalCopySetup
          path: |
            helper/windows/dist/JjalCopySetup.exe
            helper/windows/dist/JjalCopySetup.sha256

      - name: 릴리스에 첨부
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag -R $env:GITHUB_REPOSITORY *> $null
          # 릴리스가 없으면 시험판으로 만든다 (정식판은 사람이 gh release create 로 먼저 만든다 → 「최신」 링크 보호)
          if ($LASTEXITCODE -ne 0) { gh release create $tag -R $env:GITHUB_REPOSITORY --prerelease --title "짤 복사 도우미 $tag (자동 빌드)" --notes "자동 빌드" }
          # JjalCopy.exe 도 함께 — 옛 다운로드 링크(releases/latest/download/JjalCopy.exe) 호환용(설치 없이 실행만 됨)
          gh release upload $tag dist/JjalCopySetup.exe dist/JjalCopy.exe -R $env:GITHUB_REPOSITORY --clobber
