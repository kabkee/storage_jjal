<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#F6F7F9" />
<title>짤방 디자인 시안 (2026-11-21)</title>
<!-- 디자인 시안 전용 페이지: dev 서버(/mockup/redesign.html)에서만 열린다. 빌드(index.html 입력)에는 포함되지 않음 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<script>
  // 첫 그리기 전에 저장된 테마·색을 적용(다크 모드에서 하얗게 번쩍이는 것 방지)
  (() => {
    const st = JSON.parse(localStorage.getItem('jjal_settings') || '{}');
    const dark = st.theme === 'dark' || ((st.theme || 'system') === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.dataset.theme = 'dark';
    if (st.accent) document.documentElement.style.setProperty('--accent', st.accent);
  })();
</script>
<style>
/* 강조색(--accent)·글자색(--on-accent)은 설정에서 고른 값을 JS 가 넣는다. 기본은 파랑 */
:root {
  --accent: #3B6CF6; --on-accent: #fff;
  --bg: #F6F7F9; --surface: #fff; --text: #191C22; --sub: #6B7280; --line: #E5E7EB; --chip: #F0F1F4;
  --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--surface));
  --radius: 10px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1B1E24; --text: #ECEEF2; --sub: #9AA1AC; --line: #2B2F37; --chip: #262A32;
  --accent-soft: color-mix(in srgb, var(--accent) 24%, var(--surface));
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--text); font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

/* ── 헤더 (고정) ── */
.header { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.header-inner { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.logo { font-weight: 800; font-size: 17px; white-space: nowrap; letter-spacing: -.02em; }
.logo span { color: var(--accent); }
.search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 0 12px; height: 44px; transition: border-color .15s; }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; border: 0; outline: 0; background: none; font: inherit; font-size: 15px; color: var(--text); min-width: 0; }
.search kbd { font-size: 11px; color: var(--sub); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.icon-btn { height: 44px; padding: 0 14px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.icon-btn.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* ── 필터 줄 ── */
.toolbar { max-width: 1240px; margin: 0 auto; padding: 10px 16px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.drop { height: 36px; padding: 0 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
.drop.has { border-color: var(--accent); font-weight: 700; background: var(--accent-soft); }
.drop .caret { font-size: 10px; opacity: .6; }
.seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; }
.seg button { height: 30px; padding: 0 12px; border-radius: 999px; font-size: 13px; color: var(--sub); }
.seg button.on { background: var(--surface); color: var(--text); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.spacer { flex: 1; }
.count { font-size: 13px; color: var(--sub); }
.count b { color: var(--text); }

.panel { max-width: 1240px; margin: 8px auto 0; padding: 0 16px; }
.panel-inner { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 32px; padding: 0 12px; border-radius: 999px; background: var(--chip); font-size: 13.5px; }
.chip.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.active-row { max-width: 1240px; margin: 8px auto 0; padding: 0 16px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.active-chip { height: 28px; padding: 0 8px 0 12px; border-radius: 999px; background: var(--accent-soft); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.active-chip .x { opacity: .6; font-size: 15px; line-height: 1; }
.link { font-size: 13px; color: var(--sub); text-decoration: underline; }

/* ── 최근 쓴 짤 띠 ── */
.section { max-width: 1240px; margin: 16px auto 0; padding: 0 16px; }
.section-title { font-size: 13px; font-weight: 700; color: var(--sub); margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
.strip .card { flex: 0 0 76px; scroll-snap-align: start; }
.strip .card .name, .strip .card .more { display: none; }
.strip .badge { font-size: 0; padding: 2px 4px; }
.strip .badge::before { content: '▶'; font-size: 9px; }

/* ── 그리드 ── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); min-width: 0; gap: 10px; padding-bottom: 120px; }
.card { position: relative; min-width: 0; }
.thumb { position: relative; aspect-ratio: 1; border-radius: var(--radius); overflow: hidden; background: var(--chip); cursor: pointer; transition: transform .12s, box-shadow .12s; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card:hover .thumb { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.14); }
.badge { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: 10px; font-weight: 700; border-radius: 6px; padding: 2px 5px; pointer-events: none; }
.more { position: absolute; right: 5px; top: 5px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 16px; line-height: 28px; opacity: 0; transition: opacity .15s; }
.card:hover .more { opacity: 1; }
.name { font-size: 12px; color: var(--sub); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
.copied { position: absolute; inset: 0; background: color-mix(in srgb, var(--accent) 80%, transparent); color: var(--on-accent); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; gap: 2px; animation: pop .9s ease forwards; pointer-events: none; }
.copied .check { font-size: 26px; }
@keyframes pop { 0% { opacity: 0; } 12% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
.sel-mark { position: absolute; right: 6px; top: 6px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.3); color: var(--on-accent); font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.card.selected .thumb { outline: 3px solid var(--accent); outline-offset: -3px; }
.card.selected .sel-mark { background: var(--accent); border-color: var(--accent); }
.empty { text-align: center; padding: 60px 16px; color: var(--sub); }
.empty button { margin-top: 12px; }

/* ── 상세 보기 ── */
.dim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; display: flex; align-items: center; justify-content: center; }
.sheet { background: var(--surface); border-radius: 18px; width: min(720px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; display: grid; grid-template-columns: 1fr 1fr; }
.sheet .big { background: #000; display: flex; align-items: center; justify-content: center; min-height: 320px; }
.sheet .big img { max-width: 100%; max-height: 70vh; display: block; }
.sheet .info { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { margin: 0; font-size: 19px; letter-spacing: -.02em; }
.meta-label { font-size: 12px; color: var(--sub); margin-bottom: 6px; font-weight: 600; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags .chip { height: 28px; font-size: 12.5px; }
.actions { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.btn { height: 42px; border-radius: 10px; background: var(--chip); font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--on-accent); grid-column: 1 / -1; height: 48px; font-size: 15px; }
.close { position: absolute; }

/* ── 선택(공유) 바 ── */
.select-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 30; background: var(--text); color: var(--bg); border-radius: 14px; padding: 10px 12px 10px 18px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: calc(100vw - 24px); }
.select-bar .btn { height: 36px; padding: 0 14px; background: rgba(255,255,255,.14); color: inherit; }
:root[data-theme="dark"] .select-bar .btn { background: rgba(0,0,0,.1); }
.select-bar .btn.primary { background: var(--accent); color: var(--on-accent); grid-column: auto; height: 36px; font-size: 14px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; }

/* ── 설정 탭 ── */
.icon-btn.square { width: 44px; padding: 0; justify-content: center; font-size: 18px; }
.settings { background: var(--surface); border-radius: 18px; width: min(440px, calc(100vw - 24px)); max-height: 86vh; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 22px; }
.settings h2 { margin: 0; font-size: 19px; display: flex; align-items: center; justify-content: space-between; }
.set-label { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.set-desc { font-size: 12px; color: var(--sub); margin-bottom: 10px; }
.seg.wide { display: flex; }
.seg.wide button { flex: 1; height: 38px; font-size: 14px; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.swatch { width: 36px; height: 36px; border-radius: 50%; position: relative; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
.swatch.on::after { content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--sw-on, #fff); }
.swatch.on { outline: 2px solid var(--text); outline-offset: 2px; }
.custom { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; position: relative; background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red); }
.custom.on { outline: 2px solid var(--text); outline-offset: 2px; }
.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.preview { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px; border-radius: 12px; background: var(--bg); }
.set-row { display: flex; gap: 8px; flex-wrap: wrap; }
.set-row .btn { padding: 0 14px; height: 38px; font-size: 13px; }

/* ── 모바일 ── */
@media (max-width: 640px) {
  .logo { display: none; }
  .header-inner { padding: 8px 12px; gap: 8px; }
  .search kbd { display: none; }
  .icon-btn .label { display: none; }
  .toolbar, .panel, .active-row, .section { padding-left: 12px; padding-right: 12px; }
  .count { width: 100%; order: 9; }
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .more { opacity: 1; width: 24px; height: 24px; line-height: 24px; font-size: 14px; }
  .dim { align-items: flex-end; }
  .sheet { width: 100vw; border-radius: 18px 18px 0 0; grid-template-columns: 1fr; max-height: 90vh; }
  .sheet .big { min-height: 0; }
  .sheet .big img { max-height: 45vh; }
  .settings { width: 100vw; border-radius: 18px 18px 0 0; }
}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
// ─── 데이터 ───────────────────────────────────────────────
const [data, taxonomy] = await Promise.all([
  fetch('/assets/data/data.json').then(r => r.json()),
  fetch('/assets/data/taxonomy.json').then(r => r.json()),
]);
const all = data.filter(d => d.file).map(d => ({ ...d, id: String(d.id) }));
const norm = s => (s || '').normalize('NFC').toLowerCase().replace(/\s+/g, '');
const enAlias = {};
for (const axis of ['emotion', 'situation']) for (const t of taxonomy[axis]) enAlias[t.ko] = t.en.join(' ');
const haystack = new Map(all.map(d => [d.id, norm([d.name, d.tag, ...(d.emotion || []), ...(d.situation || []),
  ...[...(d.emotion || []), ...(d.situation || [])].map(k => enAlias[k] || '')].join(' '))]));

// ─── 상태 ─────────────────────────────────────────────────
const S = {
  q: '', emotion: [], situation: [], motion: 'all',
  open: null,        // 'emotion' | 'situation' | null
  detail: null, selectMode: false, selected: [],
  recent: JSON.parse(localStorage.getItem('mock_recent') || 'null')
    ?? [...all].sort((a, b) => (b.added || '').localeCompare(a.added || '') || b.id - a.id).slice(0, 12).map(d => d.id),
  copiedId: null, toast: '',
};
const byId = new Map(all.map(d => [d.id, d]));

const filtered = () => {
  const q = norm(S.q);
  return all.filter(d =>
    (!q || haystack.get(d.id).includes(q)) &&
    S.emotion.every(e => d.emotion?.includes(e)) &&
    S.situation.every(s => d.situation?.includes(s)) &&
    (S.motion === 'all' || (S.motion === 'anim') === !!d.animated)
  ).sort((a, b) => b.id - a.id);
};

// ─── 렌더 ─────────────────────────────────────────────────
const h = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const card = (d, where) => `
  <div class="card ${S.selectMode && S.selected.includes(d.id) ? 'selected' : ''}" data-id="${d.id}" data-where="${where}">
    <div class="thumb" data-act="click">
      <img loading="lazy" src="/${h(d.thumb || d.file)}" alt="${h(d.name)}" draggable="false">
      ${d.animated ? '<span class="badge">▶ 움짤</span>' : ''}
      ${S.selectMode ? `<span class="sel-mark">${S.selected.includes(d.id) ? S.selected.indexOf(d.id) + 1 : ''}</span>`
                     : `<button class="more" data-act="detail" title="자세히">⋯</button>`}
      ${S.copiedId === d.id + where ? '<div class="copied"><span class="check">✓</span>복사됨</div>' : ''}
    </div>
    <div class="name">${h(d.name)}</div>
  </div>`;

function render() {
  const list = filtered();
  const active = [...S.emotion.map(v => ['emotion', v]), ...S.situation.map(v => ['situation', v])];
  const showRecent = !S.q && !active.length && S.motion === 'all' && !S.selectMode && S.recent.length;
  const keepFocus = document.activeElement?.id === 'q';
  const caret = keepFocus ? document.activeElement.selectionStart : 0;

  document.getElementById('app').innerHTML = `
  <header class="header"><div class="header-inner">
    <div class="logo">🐾 값기의 <span>짤방</span></div>
    <label class="search">
      <span>🔍</span>
      <input id="q" value="${h(S.q)}" placeholder="어떤 짤 찾아? 축하·퇴근·고양이…" autocomplete="off">
      ${S.q ? '<button data-act="clear-q" title="지우기">✕</button>' : '<kbd>/</kbd>'}
    </label>
    <button class="icon-btn square" data-act="theme-toggle" title="${isDark() ? '라이트 모드로' : '다크 모드로'}" aria-label="테마 전환">${isDark() ? '☀️' : '🌙'}</button>
    <button class="icon-btn square" data-act="settings" title="설정" aria-label="설정">⚙️</button>
    <button class="icon-btn ${S.selectMode ? 'on' : ''}" data-act="select-mode">🔗<span class="label">${S.selectMode ? '선택 끝' : '골라서 공유'}</span></button>
  </div></header>

  <div class="toolbar">
    <button class="drop ${S.emotion.length ? 'has' : ''}" data-act="open" data-axis="emotion">
      감정${S.emotion.length ? ` ${S.emotion.length}` : ''} <span class="caret">${S.open === 'emotion' ? '▲' : '▼'}</span></button>
    <button class="drop ${S.situation.length ? 'has' : ''}" data-act="open" data-axis="situation">
      상황${S.situation.length ? ` ${S.situation.length}` : ''} <span class="caret">${S.open === 'situation' ? '▲' : '▼'}</span></button>
    <div class="seg">
      ${[['all', '전부'], ['still', '정지'], ['anim', '움짤']].map(([v, l]) =>
        `<button class="${S.motion === v ? 'on' : ''}" data-act="motion" data-v="${v}">${l}</button>`).join('')}
    </div>
    <div class="spacer"></div>
    <div class="count"><b>${list.length}</b>개 짤 · 최신순</div>
  </div>

  ${S.open ? `<div class="panel"><div class="panel-inner">
    ${taxonomy[S.open].map(t => `<button class="chip ${S[S.open].includes(t.ko) ? 'on' : ''}" data-act="toggle" data-axis="${S.open}" data-v="${h(t.ko)}">${h(t.ko)}</button>`).join('')}
  </div></div>` : ''}

  ${active.length ? `<div class="active-row">
    ${active.map(([a, v]) => `<span class="active-chip">${h(v)}<button class="x" data-act="toggle" data-axis="${a}" data-v="${h(v)}">×</button></span>`).join('')}
    <button class="link" data-act="reset">모두 지우기</button>
  </div>` : ''}

  ${showRecent ? `<section class="section">
    <h3 class="section-title">🕘 최근 쓴 짤</h3>
    <div class="strip">${S.recent.map(id => byId.get(id)).filter(Boolean).map(d => card(d, 'r')).join('')}</div>
  </section>` : ''}

  <section class="section">
    ${showRecent ? '<h3 class="section-title">전체 짤</h3>' : ''}
    ${list.length ? `<div class="grid">${list.map(d => card(d, 'g')).join('')}</div>`
      : `<div class="empty">맞는 짤이 없어요 🥲<br><button class="btn" style="padding:0 16px" data-act="reset-all">검색·필터 모두 풀기</button></div>`}
  </section>

  ${S.detail ? detailHtml(byId.get(S.detail)) : ''}

  ${S.selectMode ? `<div class="select-bar">
    <span><b>${S.selected.length}</b>개 선택</span>
    <button class="btn" data-act="pick-recent">최근 추가 10개</button>
    <button class="btn" data-act="sel-clear" ${S.selected.length ? '' : 'disabled'}>해제</button>
    <button class="btn primary" data-act="share-link" ${S.selected.length ? '' : 'disabled'}>링크 복사</button>
  </div>` : ''}

  ${S.toast ? `<div class="toast">${h(S.toast)}</div>` : ''}
  ${S.settingsOpen ? settingsHtml() : ''}`;

  if (keepFocus) { const q = document.getElementById('q'); q.focus(); q.setSelectionRange(caret, caret); }
}

function detailHtml(d) {
  const tags = (d.tag || '').split(',').map(s => s.trim()).filter(Boolean);
  return `<div class="dim" data-act="close"><div class="sheet" data-stop>
    <div class="big"><img src="/${h(d.file)}" alt="${h(d.name)}"></div>
    <div class="info">
      <h2>${h(d.name)} ${d.animated ? '<span class="badge" style="position:static">▶ 움짤</span>' : ''}</h2>
      <div><div class="meta-label">감정 · 상황 (누르면 필터)</div><div class="tags">
        ${(d.emotion || []).map(v => `<button class="chip" data-act="apply" data-axis="emotion" data-v="${h(v)}">${h(v)}</button>`).join('')}
        ${(d.situation || []).map(v => `<button class="chip" data-act="apply" data-axis="situation" data-v="${h(v)}">${h(v)}</button>`).join('')}
      </div></div>
      <div><div class="meta-label">태그 (누르면 검색)</div><div class="tags">
        ${tags.map(t => `<button class="chip" data-act="search-tag" data-v="${h(t)}">#${h(t)}</button>`).join('')}
      </div></div>
      <div class="actions">
        <button class="btn primary" data-act="copy-detail">📋 복사하기</button>
        <button class="btn" data-act="toast" data-v="다운로드 (시안)">⬇ 저장</button>
        <button class="btn" data-act="toast" data-v="/s/${d.id}.html 링크 복사 (시안)">🔗 공유</button>
        <button class="btn" data-act="close">닫기</button>
      </div>
    </div>
  </div></div>`;
}

// ─── 설정 (localStorage 'jjal_settings' = { theme: 'system'|'light'|'dark', accent: '#RRGGBB' }) ───
const ACCENTS = [
  ['#3B6CF6', '파랑(기본)'], ['#7C5CFC', '보라'], ['#E64980', '핑크'], ['#F76707', '주황'],
  ['#F5C400', '노랑'], ['#12B886', '초록'], ['#15AABF', '청록'], ['#495057', '먹색'],
];
const DEFAULTS = { theme: 'system', accent: '#3B6CF6' };
const settings = { ...DEFAULTS, ...JSON.parse(localStorage.getItem('jjal_settings') || '{}') };
const saveSettings = () => localStorage.setItem('jjal_settings', JSON.stringify(settings));
const darkMq = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => settings.theme === 'dark' || (settings.theme === 'system' && darkMq.matches);
// 밝은 강조색(노랑 등) 위에는 검은 글자, 어두운 색 위에는 흰 글자
const onColor = hex => {
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(c => c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.4 ? '#191C22' : '#FFFFFF';
};
function applySettings() {
  const root = document.documentElement;
  if (isDark()) root.dataset.theme = 'dark'; else delete root.dataset.theme;
  root.style.setProperty('--accent', settings.accent);
  root.style.setProperty('--on-accent', onColor(settings.accent));
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', isDark() ? '#111317' : '#F6F7F9');
}
darkMq.addEventListener('change', () => { if (settings.theme === 'system') { applySettings(); render(); } });

function settingsHtml() {
  const preset = ACCENTS.some(([c]) => c.toLowerCase() === settings.accent.toLowerCase());
  return `<div class="dim" data-act="settings-close"><div class="settings" data-stop>
    <h2>⚙️ 설정 <button class="btn" style="height:34px;padding:0 12px" data-act="settings-close" data-force>닫기</button></h2>
    <div>
      <div class="set-label">화면 모드</div>
      <div class="set-desc">「시스템」은 폰·PC 설정을 따라가요. 헤더의 🌙/☀️ 버튼으로도 바로 바꿀 수 있어요.</div>
      <div class="seg wide">
        ${[['system', '🖥 시스템'], ['light', '☀️ 라이트'], ['dark', '🌙 다크']].map(([v, l]) =>
          `<button class="${settings.theme === v ? 'on' : ''}" data-act="set-theme" data-v="${v}">${l}</button>`).join('')}
      </div>
    </div>
    <div>
      <div class="set-label">강조색</div>
      <div class="set-desc">버튼·선택한 칩·복사 표시에 쓰이는 색이에요. 무지개 동그라미로 직접 고를 수도 있어요.</div>
      <div class="swatches">
        ${ACCENTS.map(([c, n]) => `<button class="swatch ${settings.accent.toLowerCase() === c.toLowerCase() ? 'on' : ''}"
            style="background:${c};--sw-on:${onColor(c)}" title="${n}" aria-label="${n}" data-act="set-accent" data-v="${c}"></button>`).join('')}
        <label class="custom ${preset ? '' : 'on'}" title="직접 고르기" ${preset ? '' : `style="background:${settings.accent}"`}>
          <input type="color" id="accent-picker" value="${settings.accent}" aria-label="강조색 직접 고르기">
        </label>
      </div>
    </div>
    <div>
      <div class="set-label">미리보기</div>
      <div class="preview">
        <button class="chip on">웃김</button><button class="chip">황당</button>
        <span class="active-chip">축하 <span class="x">×</span></span>
        <button class="btn primary" style="grid-column:auto;height:36px;padding:0 14px;font-size:13px">📋 복사하기</button>
      </div>
    </div>
    <div>
      <div class="set-label">기록</div>
      <div class="set-desc">설정과 「최근 쓴 짤」은 이 브라우저에만 저장돼요.</div>
      <div class="set-row">
        <button class="btn" data-act="clear-recent">🕘 최근 쓴 짤 지우기 (${S.recent.length}개)</button>
        <button class="btn" data-act="reset-settings">↺ 설정 초기화</button>
      </div>
    </div>
  </div></div>`;
}

// ─── 동작 ─────────────────────────────────────────────────
let toastTimer, copyTimer;
const toast = msg => { S.toast = msg; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = ''; render(); }, 1600); };
const copy = (id, where) => {
  S.recent = [id, ...S.recent.filter(x => x !== id)].slice(0, 20);
  localStorage.setItem('mock_recent', JSON.stringify(S.recent));
  S.copiedId = id + where; render();
  clearTimeout(copyTimer); copyTimer = setTimeout(() => { S.copiedId = null; render(); }, 900);
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  if (t.dataset.act === 'close' && e.target.closest('[data-stop]') && !t.closest('.actions')) return; // 시트 안쪽 클릭은 닫지 않음
  if (t.dataset.act === 'settings-close' && e.target.closest('[data-stop]') && !('force' in t.dataset)) return;
  const { act, axis, v } = t.dataset;
  const cardEl = t.closest('.card');
  const id = cardEl?.dataset.id;
  switch (act) {
    case 'click':
      if (S.selectMode) { S.selected = S.selected.includes(id) ? S.selected.filter(x => x !== id) : [...S.selected, id]; render(); }
      else copy(id, cardEl.dataset.where);
      break;
    case 'detail': e.stopPropagation(); S.detail = id; render(); break;
    case 'close': S.detail = null; render(); break;
    case 'copy-detail': { const d = S.detail; S.detail = null; copy(d, 'g'); toast('복사됐어요! 카톡에 붙여넣기 하세요'); break; }
    case 'open': S.open = S.open === axis ? null : axis; render(); break;
    case 'toggle': S[axis] = S[axis].includes(v) ? S[axis].filter(x => x !== v) : [...S[axis], v]; render(); break;
    case 'apply': S.detail = null; if (!S[axis].includes(v)) S[axis] = [...S[axis], v]; render(); break;
    case 'search-tag': S.detail = null; S.q = v; render(); break;
    case 'motion': S.motion = v; render(); break;
    case 'reset': S.emotion = []; S.situation = []; render(); break;
    case 'reset-all': Object.assign(S, { q: '', emotion: [], situation: [], motion: 'all' }); render(); break;
    case 'clear-q': S.q = ''; render(); document.getElementById('q').focus(); break;
    case 'select-mode': S.selectMode = !S.selectMode; S.selected = []; render(); break;
    case 'sel-clear': S.selected = []; render(); break;
    case 'pick-recent': S.selected = [...all].sort((a, b) => b.id - a.id).slice(0, 10).map(d => d.id); render(); break;
    case 'share-link': toast(`/?ids=${S.selected.join(',')} 링크 복사 (시안)`); break;
    case 'toast': toast(v); break;
    case 'theme-toggle': settings.theme = isDark() ? 'light' : 'dark'; saveSettings(); applySettings(); render(); break;
    case 'settings': S.settingsOpen = true; render(); break;
    case 'settings-close': S.settingsOpen = false; render(); break;
    case 'set-theme': settings.theme = v; saveSettings(); applySettings(); render(); break;
    case 'set-accent': settings.accent = v; saveSettings(); applySettings(); render(); break;
    case 'clear-recent': S.recent = []; localStorage.setItem('mock_recent', '[]'); toast('최근 쓴 짤을 지웠어요'); break;
    case 'reset-settings': Object.assign(settings, DEFAULTS); localStorage.removeItem('jjal_settings'); applySettings(); toast('설정을 처음으로 돌렸어요'); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; render(); }
  // 색 고르는 중에는 다시 그리지 않고 색만 바꾼다(피커가 닫히지 않게), 다 고르면 change 에서 저장
  if (e.target.id === 'accent-picker') { settings.accent = e.target.value; applySettings(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'accent-picker') { settings.accent = e.target.value; saveSettings(); applySettings(); render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement?.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('q').focus(); }
  if (e.key === 'Escape') { S.detail = null; S.open = null; S.settingsOpen = false; render(); }
});
applySettings();
render();
</script>
</body>
</html>
